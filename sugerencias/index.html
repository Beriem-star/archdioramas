<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Ideas recibidas · ArchDioramas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/blog/blog.css">
<style>
.panel{max-width:960px;margin:0 auto;padding:40px 20px 60px}
.panel h1{font-size:clamp(30px,4vw,42px);font-weight:800;margin:6px 0 8px}
.panel > p{color:var(--muted);margin:0 0 20px}
.login{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.login input,.tools select,.tools input{font:16px var(--body);padding:10px 12px;border:1.5px solid var(--ink);border-radius:4px;background:var(--sheet);color:var(--ink)}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0;align-items:center}
.tools .count{font-family:var(--mono);font-size:13px;color:var(--muted);margin-left:auto}
.btn{cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink)}
.list{display:flex;flex-direction:column;gap:12px}
.item{background:var(--sheet);border:1px solid var(--line);padding:16px 18px;display:grid;grid-template-columns:1fr auto;gap:8px 16px}
.item .idea{font-size:17px;margin:0;white-space:pre-wrap;word-break:break-word}
.item .meta{grid-column:1/2}
.item .badge{font-family:var(--mono);font-size:12px;border:1px solid var(--line);padding:1px 7px;margin-right:6px}
.item .badge.video{border-color:var(--wood);color:var(--wood)}
.item .badge.blog{border-color:var(--blue);color:var(--blue)}
.item button{grid-row:1/3;grid-column:2;align-self:start;font:600 13px var(--body);padding:6px 10px;border:1.5px solid var(--line);background:transparent;color:var(--muted);border-radius:4px;cursor:pointer}
.item button:hover{border-color:var(--ink);color:var(--ink)}
.note{color:var(--blue);font-weight:600;min-height:1.4em}
.empty{border:1px dashed var(--line);padding:30px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<header class="top"><div class="wrap">
<a class="logo" href="/"><span class="a">arch</span><span class="b">DIORAMAS</span></a>
<nav class="links"><a href="/es/blog/">Guías</a></nav>
</div></header>

<main class="panel">
  <span class="tag">PRIVADO · SOLO PARA TI</span>
  <h1>Ideas recibidas</h1>
  <p>Lo que tu público quiere ver en el próximo video o guía. Esta página no aparece en Google.</p>

  <form class="login" id="login">
    <label for="key" style="position:absolute;left:-9999px">Contraseña</label>
    <input type="password" id="key" placeholder="Contraseña" autocomplete="current-password">
    <button class="btn" type="submit">Ver ideas</button>
  </form>
  <p class="note" id="note" role="status"></p>

  <div id="app" hidden>
    <div class="tools">
      <select id="kind" aria-label="Filtrar por tipo">
        <option value="">Todas</option>
        <option value="video">Videos</option>
        <option value="blog">Guías del blog</option>
        <option value="both">Ambos</option>
      </select>
      <input type="search" id="q" placeholder="Buscar palabra…" aria-label="Buscar">
      <button class="btn ghost" type="button" id="reload">Actualizar</button>
      <button class="btn ghost" type="button" id="csv">Descargar lista (Excel)</button>
      <span class="count" id="count"></span>
    </div>
    <div class="list" id="list"></div>
  </div>
</main>

<script>
const KIND = { video: "Video", blog: "Guía", both: "Video y guía" };
let key = "", items = [];
try { key = sessionStorage.getItem("ad-admin") || ""; } catch (e) {}
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fecha = iso => new Date(iso).toLocaleString("es-MX", { dateStyle: "medium", timeStyle: "short" });

async function load() {
  $("note").textContent = "Cargando…";
  try {
    const r = await fetch("/api/suggestions", { headers: { "x-admin-key": key } });
    const j = await r.json().catch(() => ({}));
    if (r.status === 401) { $("note").textContent = "Contraseña incorrecta."; $("app").hidden = true; return; }
    if (j.error === "no-storage") { $("note").textContent = "Falta conectar el almacenamiento en Vercel."; return; }
    if (!r.ok) { $("note").textContent = "No se pudieron cargar las ideas. Intenta de nuevo."; return; }
    try { sessionStorage.setItem("ad-admin", key); } catch (e) {}
    items = j.items; $("note").textContent = ""; $("login").hidden = true; $("app").hidden = false; render();
  } catch (e) { $("note").textContent = "Sin conexión. Intenta de nuevo."; }
}

function render() {
  const k = $("kind").value, q = $("q").value.trim().toLowerCase();
  const shown = items.filter(i => (!k || i.kind === k) && (!q || (i.idea + " " + i.name).toLowerCase().includes(q)));
  $("count").textContent = `${shown.length} de ${items.length} ideas`;
  $("list").innerHTML = shown.length ? shown.map(i => `
    <article class="item">
      <p class="idea">${esc(i.idea)}</p>
      <div class="meta"><span class="badge ${esc(i.kind)}">${KIND[i.kind] || i.kind}</span>
      <span class="badge">${i.lang === "es" ? "ES" : "EN"}</span>
      ${esc(i.name || "Anónimo")} · ${fecha(i.date)} · desde ${esc(i.page || "?")}</div>
      <button type="button" data-id="${esc(i.id)}">Borrar</button>
    </article>`).join("") : `<div class="empty">Todavía no hay ideas${q || k ? " con ese filtro" : ""}.</div>`;
}

$("login").addEventListener("submit", e => { e.preventDefault(); key = $("key").value.trim(); if (key) load(); });
$("kind").addEventListener("change", render);
$("q").addEventListener("input", render);
$("reload").addEventListener("click", load);
$("list").addEventListener("click", async e => {
  const b = e.target.closest("button[data-id]"); if (!b) return;
  b.disabled = true; b.textContent = "Borrando…";
  const r = await fetch("/api/suggestions?id=" + encodeURIComponent(b.dataset.id), { method: "DELETE", headers: { "x-admin-key": key } });
  if (r.ok) { items = items.filter(i => i.id !== b.dataset.id); render(); }
  else { b.disabled = false; b.textContent = "Borrar"; }
});
$("csv").addEventListener("click", () => {
  const rows = [["Fecha", "Tipo", "Idioma", "Nombre", "Idea", "Página"],
    ...items.map(i => [fecha(i.date), KIND[i.kind] || i.kind, i.lang, i.name, i.idea, i.page])];
  const csv = "﻿" + rows.map(r => r.map(v => `"${String(v ?? "").replace(/"/g, '""')}"`).join(",")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
  a.download = "ideas-archdioramas.csv"; a.click();
});
if (key) load();
</script>
</body>
</html>
